function tbl(cols,rows){
if(!rows.length)return '<p class="hint">无记录</p>';
return '<div class="scroll-table"><table><thead><tr>'+cols.map(function(c){return '<th>'+h(c[1])+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+cols.map(function(c){return '<td>'+h(r[c[0]]||'—')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
}
function summary(){
return '<h4 class="summary-head">一、项目基本信息</h4><div class="summary">'+kv('项目名称',state.projectName)+kv('研究周期',state.startMonth+' 至 '+state.endMonth)+'</div>'+
'<h4 class="summary-head">二、负责人及联系方式</h4><div class="summary">'+[['姓名','name'],['性别','gender'],['出生年月','birthMonth'],['专业技术职称','title'],['现任职务','position'],['教龄','years'],['工作单位','unit'],['电子邮箱','email'],['联系电话','phone']].map(function(v){return kv(v[0],state[v[1]]);}).join('')+'</div>'+
'<h4 class="summary-head">三、承担的主要教学工作（'+state.courses.length+'条）</h4>'+tbl([['period','时间'],['course','课程名称'],['hours','学时'],['unit','所在单位']],state.courses)+
'<h4 class="summary-head">四、项目组主要成员（'+state.members.length+'人）</h4>'+tbl([['name','姓名'],['age','年龄'],['title','专业技术职务'],['role','行政职务'],['unit','工作单位'],['field','主要教学科研领域'],['duty','项目分工']],state.members)+
'<h4 class="summary-head">五、附件清单（'+files.length+'个）</h4><p class="hint">'+(files.length?files.map(function(f){return h(f.name);}).join('、'):'无')+'</p>'+(sampleLoaded?'<div class="notice">注意：载入的人员信息包含原表占位示例，请确保已核对。</div>':'');
}
function error(msg){el('error').innerHTML=msg?'<div class="error">请检查：'+h(msg)+'</div>':'';if(msg)el('error').scrollIntoView({behavior:'smooth',block:'center'});}
function validate(s){
var t=function(v){return String(v==null?"":v).trim();};
if(s===0){if(!t(state.projectName))return "项目名称不能为空";if(!state.startMonth||!state.endMonth)return "请选择起止年月";if(state.startMonth>=state.endMonth)return "结束年月必须晚于起始年月";}
if(s===1){
for(var k of [['name','负责人姓名'],['gender','性别'],['birthMonth','出生年月'],['title','专业技术职称'],['position','现任职务'],['years','教龄'],['unit','工作单位'],['email','电子邮箱'],['phone','联系电话']])if(!t(state[k[0]]))return k[1]+"不能为空";
if(!/^\d+$/.test(state.years)||Number(state.years)>60)return "教龄须为 0—60 之间的整数";
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email))return "电子邮箱格式不正确";
if(!/^(1[3-9]\d{9}|0\d{2,3}-?\d{7,8})$/.test(state.phone))return "联系电话应为中国大陆手机号或带区号的座机号";
if(!state.courses.length)return "请至少填写一条教学工作";
for(var c of state.courses){if(!t(c.period)||!t(c.course)||!t(c.unit))return "请补全所有教学工作条目的时间、课程名称、所在单位";if(!/^\d+$/.test(c.hours)||+c.hours<1||+c.hours>500)return "学时须为 1—500 之间的整数";}
}
if(s===2){if(!state.members.length)return "请至少填写一名项目成员";for(var m of state.members){for(var a of ['name','age','title','role','unit','field','duty'])if(!t(m[a]))return "项目成员的所有字段均须填写（无行政职务可填写“无”）";if(!/^\d+$/.test(m.age)||+m.age<18||+m.age>80)return "成员年龄须为 18—80 之间的整数";}}
return "";
}
function render(){
el('steps').innerHTML=STEPS.map(function(x,i){return '<button class="step '+(i===step?'active':i<step?'done':'')+'" data-action="go" data-i="'+i+'"><span class="num">'+(i<step?'✓':i+1)+'</span><span>'+h(x)+'</span></button>';}).join('');
el('kicker').textContent='STEP 0'+(step+1)+' / 04';
el('heading').textContent=STEPS[step];el('desc').textContent=DESCS[step];el('ordinal').textContent=(step+1)+' / 4';
el('progress').style.width=((step+1)*25)+'%';
el('view').innerHTML=mainContent();el('back').style.visibility=step===0?'hidden':'visible';
el('next').textContent=step===3?'导出申报信息 ↓':'下一步　→';
el('next').className='btn '+(step===3?'gold':'primary');error('');
}
function go(target){if(target>step){for(var s=step;s<target;s++){var e=validate(s);if(e){error(e);return;}}}step=target;render();window.scrollTo({top:0,behavior:'smooth'});}
function createDownload(){
for(var i=0;i<3;i++){var e=validate(i);if(e){step=i;render();error(e);return;}}
var payload={format:"高校教学改革专项项目申报",version:"1.0",exportedAt:new Date().toISOString(),onlineSubmitted:false,warning:"本文件由演示页面生成，不代表已在线申报。附件文件正文不包含在内。",project:state,attachments:files.map(function(f){return {name:f.name,size:f.size};})};
var b=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download="教改项目申报.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},3000);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({data:state,sampleLoaded:sampleLoaded,savedAt:new Date().toISOString()}));alert("草稿已保存在当前浏览器中（不含附件）。");}catch(e){alert("浏览器不允许本地保存，请导出申报信息备份。");}}
function restore(){try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(!p){alert("未找到本地草稿。");return;}if(!confirm("恢复草稿会覆盖当前表单内容，确定吗？"))return;state=Object.assign(JSON.parse(JSON.stringify(original)),p.data||{});sampleLoaded=!!p.sampleLoaded;files=[];step=0;render();alert("已恢复草稿。");}catch(e){alert("草稿无法读取。");}}
function clear(){if(confirm("确定删除本机保存的草稿吗？")){localStorage.removeItem(KEY);alert("本地草稿已清除。");}}
document.addEventListener('input',function(ev){var t=ev.target;if(t.dataset.field){state[t.dataset.field]=t.value;error('');}else if(t.dataset.group&&t.dataset.key){var row=state[t.dataset.group][+t.dataset.i];if(row)row[t.dataset.key]=t.value;error('');}});
document.addEventListener('change',function(ev){var t=ev.target;if(t.dataset.field)state[t.dataset.field]=t.value;else if(t.id==='attachment'){var accepted=['pdf','doc','docx'];Array.from(t.files||[]).forEach(function(f){var ext=f.name.split('.').pop().toLowerCase();if(!accepted.includes(ext)||f.size>10*1024*1024||!f.size){alert("附件不合要求："+f.name);return;}if(files.length>=3){alert("附件最多 3 个");return;}files.push(f);});render();}});
document.addEventListener('click',function(ev){
var b=ev.target.closest('[data-action]');if(!b)return;var a=b.dataset.action;
if(a==='next'){if(step===3){createDownload();return;}var e=validate(step);if(e)error(e);else go(step+1);}
else if(a==='back'&&step>0)go(step-1);
else if(a==='go')go(+b.dataset.i);
else if(a==='save')save();
else if(a==='restore')restore();
else if(a==='clear')clear();
else if(a==='add'){var g=b.dataset.group;if(g==='courses')state.courses.push({period:"",course:"",hours:"",unit:""});else state.members.push({name:"",age:"",title:"",role:"",unit:"",field:"",duty:""});render();}
else if(a==='remove'){state[b.dataset.group].splice(+b.dataset.i,1);render();}
else if(a==='sample-courses'){if(state.courses.length&&!confirm("这将覆盖现有教学工作列表，继续吗？"))return;state.courses=JSON.parse(JSON.stringify(sampleCourses));render();}
else if(a==='sample-members'){if(state.members.length&&!confirm("这将覆盖现有成员列表，继续吗？"))return;state.members=JSON.parse(JSON.stringify(sampleMembers));sampleLoaded=true;render();}
else if(a==='file-remove'){files.splice(+b.dataset.i,1);render();}
else if(a==='print'){for(var i=0;i<3;i++){var ee=validate(i);if(ee){step=i;render();error(ee);return;}}window.print();}
});
render();
})();
</script>
</body>
</html>
