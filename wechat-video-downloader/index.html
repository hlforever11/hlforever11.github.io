<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="免费解析微信视频号分享链接，并保存公开可访问的视频。">
  <meta name="theme-color" content="#f2f4f2">
  <title>微信视频号视频下载</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f4f2;
      --surface: rgba(251, 252, 251, 0.94);
      --surface-solid: #fbfcfb;
      --ink: #1d2421;
      --muted: #6c7571;
      --faint: #909894;
      --line: #dfe4e1;
      --soft: #e9edea;
      --accent: #4d6259;
      --accent-dark: #3f524a;
      --error: #8c4f49;
      --error-bg: #f7efed;
      --shadow: 0 24px 70px rgba(32, 44, 38, 0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -20%, rgba(77, 98, 89, 0.09), transparent 39%),
        linear-gradient(180deg, #f8f9f8 0%, var(--paper) 48%, #eef1ef 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input, a { -webkit-tap-highlight-color: transparent; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(52px, 9vh, 92px) 20px 28px;
    }

    .hero, .workbench, .result, .note { width: min(760px, 100%); }

    .hero { text-align: center; }

    .mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      color: #f7faf8;
      background: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 17px;
      box-shadow: 0 12px 30px rgba(61, 82, 73, 0.16);
    }

    .mark svg { width: 27px; height: 27px; }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5.6vw, 48px);
      font-weight: 680;
      letter-spacing: -0.045em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .workbench {
      margin-top: 40px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 29px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    textarea {
      width: 100%;
      min-height: 132px;
      resize: vertical;
      padding: 18px 19px;
      color: var(--ink);
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: 20px;
      outline: none;
      font: inherit;
      font-size: 16px;
      line-height: 1.65;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea::placeholder { color: #a0a7a3; }

    textarea:focus {
      border-color: #9aa9a2;
      box-shadow: 0 0 0 4px rgba(77, 98, 89, 0.08);
    }

    .actions { display: flex; gap: 10px; margin-top: 12px; }

    .service-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 4px 0;
      color: var(--faint);
      font-size: 12px;
    }

    .service-label { display: inline-flex; align-items: center; gap: 7px; }

    .service-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      background: #b5bcb8;
      border-radius: 50%;
    }

    .service-dot.ready { background: #667d71; }

    button, .button-link {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 21px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 620;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.16s ease, opacity 0.16s ease, transform 0.12s ease;
    }

    button:active, .button-link:active { transform: scale(0.985); }
    button:focus-visible, .button-link:focus-visible { outline: 3px solid rgba(77, 98, 89, 0.22); outline-offset: 2px; }

    .primary { flex: 1; color: #fff; background: var(--accent); }
    .primary:hover { background: var(--accent-dark); }
    .primary:disabled { opacity: 0.36; cursor: not-allowed; }
    .secondary { color: #505a55; background: var(--soft); }
    .secondary:hover { background: #e1e6e3; }

    .text-button {
      min-height: auto;
      padding: 2px 0;
      color: #63716a;
      background: transparent;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .text-button:hover { color: var(--accent-dark); text-decoration: underline; }

    .status {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
    }

    .status.show { display: block; }
    .status.loading { color: #53655d; background: #edf2ef; }
    .status.error { color: var(--error); background: var(--error-bg); border: 1px solid #ead7d3; }
    .status a { color: inherit; font-weight: 650; }

    .spinner {
      width: 15px;
      height: 15px;
      display: inline-block;
      margin-right: 7px;
      vertical-align: -3px;
      border: 2px solid rgba(77, 98, 89, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.78s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      display: none;
      margin-top: 20px;
      overflow: hidden;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 14px 44px rgba(32, 44, 38, 0.06);
    }

    .result.show { display: block; }

    .media { display: grid; grid-template-columns: 188px 1fr; gap: 20px; padding: 20px; }

    .cover {
      width: 188px;
      height: 234px;
      display: none;
      object-fit: cover;
      background: var(--soft);
      border-radius: 18px;
    }

    .cover.show { display: block; }

    .meta { min-width: 0; display: flex; flex-direction: column; justify-content: center; }

    .video-title {
      display: -webkit-box;
      overflow: hidden;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .author { margin-top: 9px; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .tag { padding: 6px 10px; color: #68716d; background: var(--soft); border-radius: 999px; font-size: 12px; }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      padding: 17px 20px;
      border-top: 1px solid var(--line);
    }

    .download { color: #fff; background: var(--accent); }
    .download:hover { background: var(--accent-dark); }

    .note {
      margin-top: 18px;
      color: var(--faint);
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
    }

    .privacy { margin-top: 5px; font-size: 11px; }

    footer {
      margin-top: auto;
      padding-top: 64px;
      color: var(--faint);
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer-meta { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 9px 12px; }
    .footer-meta a { color: #737c77; text-decoration: none; }
    .footer-meta a:hover { text-decoration: underline; }
    .divider { width: 1px; height: 12px; background: #cfd5d1; }
    .counter { height: 22px; width: auto; display: block; opacity: 0.82; }
    .scope { margin-top: 8px; color: #a1a7a4; font-size: 11px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 10;
      padding: 10px 15px;
      color: #fff;
      background: rgba(29, 36, 33, 0.9);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 13px;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 620px) {
      .page { padding-top: 48px; }
      .workbench { margin-top: 32px; padding: 12px; }
      .actions { flex-direction: column; }
      .secondary { width: 100%; }
      .media { grid-template-columns: 1fr; padding: 16px; }
      .cover { width: 100%; height: auto; aspect-ratio: 16 / 11; }
      .result-actions { grid-template-columns: 1fr; padding: 16px; }
      .result-actions > * { width: 100%; }
      .service-row { align-items: flex-start; }
      .divider { display: none; }
      .footer-meta { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v11"></path>
          <path d="m8 10 4 4 4-4"></path>
          <path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"></path>
        </svg>
      </div>
      <h1>微信视频号视频下载</h1>
      <p class="subtitle">粘贴视频号分享链接，解析后保存公开视频。</p>
    </header>

    <section class="workbench" aria-label="视频解析">
      <label for="shareInput" class="sr-only" hidden>视频号分享链接</label>
      <textarea id="shareInput" placeholder="粘贴视频号分享链接或整段分享文字，例如：https://weixin.qq.com/sph/..." spellcheck="false" autocomplete="off"></textarea>
      <div class="actions">
        <button id="parseButton" class="primary" type="button" disabled>开始解析</button>
        <button id="clearButton" class="secondary" type="button">清空</button>
      </div>
      <div class="service-row">
        <span class="service-label">
          <span id="serviceDot" class="service-dot ready" aria-hidden="true"></span>
          匿名免费解析 · 无需 Token
        </span>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="result" class="result" aria-live="polite">
      <div class="media">
        <img id="cover" class="cover" alt="视频封面" referrerpolicy="no-referrer">
        <div class="meta">
          <div id="videoTitle" class="video-title">微信视频号视频</div>
          <div id="author" class="author"></div>
          <div class="tags">
            <span class="tag">公开视频</span>
            <span id="format" class="tag">MP4</span>
            <span id="counts" class="tag" hidden></span>
          </div>
        </div>
      </div>
      <div class="result-actions">
        <a id="downloadButton" class="button-link download" href="#" target="_blank" rel="noopener noreferrer">下载 / 打开原视频</a>
        <button id="copyButton" class="secondary" type="button">复制直链</button>
        <button id="againButton" class="secondary" type="button">解析另一个</button>
      </div>
    </section>

    <div class="note">
      如果浏览器直接播放视频，请在播放页面选择“保存视频”或“视频另存为”。
      <div class="privacy">解析请求会经过免费后端；本站不保存分享链接或视频，视频文件由源站或下载代理直接提供。</div>
    </div>

    <footer>
      <div class="footer-meta">
        <a href="mailto:linhu@scu.edu.cn">linhu@scu.edu.cn</a>
        <span class="divider" aria-hidden="true"></span>
        <img
          class="counter"
          src="https://hits.sh/hlforever11.github.io/wechat-video-downloader.svg?label=%E7%B4%AF%E8%AE%A1%E8%AE%BF%E9%97%AE&amp;color=4d5953&amp;labelColor=6f7873"
          alt="累计访问次数"
          referrerpolicy="no-referrer"
        >
      </div>
      <div class="scope">仅支持公开可访问的视频，解析能力可能随微信接口调整而变化。</div>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">已复制</div>

  <script>
    (() => {
      'use strict';

      const PARSE_API = 'https://wechat-video-downloader-api-hlforever11-6366.vercel.app/api/parse';
      const shareInput = document.getElementById('shareInput');
      const parseButton = document.getElementById('parseButton');
      const clearButton = document.getElementById('clearButton');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const cover = document.getElementById('cover');
      const videoTitle = document.getElementById('videoTitle');
      const author = document.getElementById('author');
      const format = document.getElementById('format');
      const counts = document.getElementById('counts');
      const downloadButton = document.getElementById('downloadButton');
      const copyButton = document.getElementById('copyButton');
      const againButton = document.getElementById('againButton');
      const toast = document.getElementById('toast');
      let currentVideoUrl = '';
      let toastTimer;

      function extractWechatUrl(text) {
        const urls = String(text || '').match(/https?:\/\/[^\s<>"'，。；、）)】]+/gi) || [];
        return urls.find((raw) => {
          try {
            const host = new URL(raw).hostname.toLowerCase();
            return host === 'weixin.qq.com'
              || host === 'channels.weixin.qq.com'
              || host === 'finder.video.qq.com'
              || host.endsWith('.weixin.qq.com');
          } catch (_) {
            return false;
          }
        }) || '';
      }

      function safeHttpUrl(raw) {
        try {
          const parsed = new URL(String(raw || ''));
          return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '';
        } catch (_) {
          return '';
        }
      }

      function clearStatus() {
        status.className = 'status';
        status.replaceChildren();
      }

      function showLoading(message) {
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-hidden', 'true');
        status.className = 'status show loading';
        status.replaceChildren(spinner, document.createTextNode(message));
      }

      function showError(message) {
        status.className = 'status show error';
        status.replaceChildren(document.createTextNode(message));
      }

      function resetResult() {
        result.classList.remove('show');
        currentVideoUrl = '';
        downloadButton.href = '#';
        cover.classList.remove('show');
        cover.removeAttribute('src');
      }

      function updateButtonState() {
        parseButton.disabled = !extractWechatUrl(shareInput.value);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1600);
      }

      function errorText(value) {
        if (!value) return '';
        if (typeof value === 'string') return value;
        if (typeof value.message === 'string') return value.message;
        if (typeof value.error === 'string') return value.error;
        return '';
      }

      function responseError(response, payload) {
        const remoteMessage = errorText(payload && payload.error) || errorText(payload);
        if (response.status === 401) return '解析后端尚未公开访问。';
        if (response.status === 403) return remoteMessage || '当前页面无权调用解析服务。';
        if (response.status === 408 || response.status === 504) return '免费解析服务运行超时，请稍后再试。';
        if (response.status === 422) {
          return [remoteMessage, payload && payload.details].filter(Boolean).join('；');
        }
        if (response.status === 429) return remoteMessage || '操作太快，请稍后再试。';
        return remoteMessage || `免费解析服务错误（HTTP ${response.status}）`;
      }

      async function parseVideo() {
        const shareUrl = extractWechatUrl(shareInput.value);
        if (!shareUrl) {
          showError('没有识别到有效的视频号分享链接。');
          return;
        }

        resetResult();
        parseButton.disabled = true;
        showLoading('正在免费解析，通常需要 10–30 秒…');

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 65000);

        try {
          const response = await fetch(PARSE_API, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json'
            },
            body: JSON.stringify({ url: shareUrl }),
            signal: controller.signal
          });

          const raw = await response.text();
          let payload;
          try {
            payload = JSON.parse(raw);
          } catch (_) {
            throw new Error('免费解析服务返回了无法识别的数据。');
          }

          if (!response.ok) {
            throw new Error(responseError(response, payload));
          }

          const item = payload;

          if (!item) {
            throw new Error('解析完成，但没有返回视频数据。请确认分享链接没有过期。');
          }

          if (item.ok === false) {
            throw new Error(errorText(item.error) || errorText(item.message) || '这个链接无法解析，请确认视频仍为公开状态。');
          }

          const videoUrl = safeHttpUrl(item.video_url);

          if (!videoUrl) {
            throw new Error('已经取得视频信息，但没有找到可下载的视频直链。');
          }

          currentVideoUrl = videoUrl;
          const title = String(item.title || '').trim();
          videoTitle.textContent = title ? title.split('\n')[0].slice(0, 100) : '微信视频号视频';

          const nickname = String(item.author || '').trim();
          author.textContent = nickname ? `视频号：${nickname}` : '';
          author.hidden = !nickname;

          const coverUrl = safeHttpUrl(item.cover_url);
          if (coverUrl) {
            cover.src = coverUrl;
            cover.classList.add('show');
          }

          format.textContent = String(item.format || 'MP4');
          counts.textContent = '匿名免费';
          counts.hidden = false;

          downloadButton.href = videoUrl;
          clearStatus();
          result.classList.add('show');
          result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (error) {
          let message = error && error.name === 'AbortError'
            ? '解析超过 65 秒，已停止等待，请稍后再试。'
            : error && error.message || '解析失败，请稍后再试。';

          if (/Failed to fetch|NetworkError/i.test(message)) {
            message = '无法连接免费解析服务，请检查网络后重试。';
          }
          showError(message);
        } finally {
          window.clearTimeout(timeout);
          updateButtonState();
        }
      }

      shareInput.addEventListener('input', updateButtonState);
      shareInput.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !parseButton.disabled) {
          parseVideo();
        }
      });

      parseButton.addEventListener('click', parseVideo);

      clearButton.addEventListener('click', () => {
        shareInput.value = '';
        clearStatus();
        resetResult();
        updateButtonState();
        shareInput.focus();
      });

      againButton.addEventListener('click', () => {
        shareInput.value = '';
        clearStatus();
        resetResult();
        updateButtonState();
        shareInput.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      copyButton.addEventListener('click', async () => {
        if (!currentVideoUrl) return;
        try {
          await navigator.clipboard.writeText(currentVideoUrl);
          showToast('视频直链已复制');
        } catch (_) {
          window.prompt('复制下面的视频直链：', currentVideoUrl);
        }
      });

      updateButtonState();
    })();
  </script>
</body>
</html>
