<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="粘贴微信视频号分享链接，解析并保存公开视频。">
  <meta name="theme-color" content="#f5f7f8">
  <title>微信视频号下载</title>
  <style>
    :root{--bg:#f5f7f8;--card:#fff;--text:#16181c;--muted:#7b838d;--line:#e6e9ed;--accent:#07c160;--accent2:#06ad56;--danger:#c43b31;--shadow:0 18px 60px rgba(24,31,39,.07)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -8%,rgba(7,193,96,.07),transparent 34%),linear-gradient(180deg,#fbfcfd,#f5f7f8 45%,#f3f5f6)}
    .page{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:82px 20px 32px}.hero,.panel,.result,.tip{width:min(760px,100%)}.hero{text-align:center}.mark{width:56px;height:56px;margin:0 auto 22px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#16d36f,#07b85c);color:#fff;font-weight:700;font-size:22px;box-shadow:0 14px 34px rgba(7,193,96,.19)}h1{margin:0;font-size:clamp(34px,6vw,52px);font-weight:680;letter-spacing:-.04em}.sub{margin:16px 0 0;font-size:17px;color:var(--muted);line-height:1.7}.panel{margin-top:44px;padding:18px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:var(--shadow)}textarea{width:100%;min-height:132px;resize:vertical;border:1px solid var(--line);border-radius:21px;background:#fff;color:var(--text);font:inherit;font-size:16px;line-height:1.65;padding:18px 19px;outline:none}textarea:focus{border-color:rgba(7,193,96,.5);box-shadow:0 0 0 4px rgba(7,193,96,.08)}.actions{display:flex;gap:10px;margin-top:12px}button,.btn{border:0;text-decoration:none;cursor:pointer;height:52px;border-radius:17px;padding:0 22px;font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}.primary,.download{background:var(--accent);color:#fff}.primary{flex:1}.primary:hover,.download:hover{background:var(--accent2)}.primary:disabled{opacity:.38;cursor:not-allowed}.ghost{background:#eef1f3;color:#4f5863}.status{display:none;margin-top:16px;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.6}.status.show{display:block}.status.loading{background:#f2f7f4;color:#4c6458}.status.error{background:#fff3f2;color:var(--danger);border:1px solid #f8d8d5}.result{display:none;margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 42px rgba(23,31,38,.06);overflow:hidden}.result.show{display:block}.media{display:grid;grid-template-columns:190px 1fr;gap:20px;padding:20px}.cover{width:190px;height:238px;border-radius:19px;background:#edf0f2;object-fit:cover;display:none}.cover.show{display:block}.meta{min-width:0;display:flex;flex-direction:column;justify-content:center}.title{font-size:18px;font-weight:650;line-height:1.55}.author{margin-top:10px;color:var(--muted);font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{background:#f2f4f5;color:#68717b;border-radius:999px;font-size:12px;padding:7px 10px}.downloadbar{padding:18px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto auto;gap:10px}.tip{margin-top:20px;color:#8c949d;font-size:12px;line-height:1.8;text-align:center}.privacy{margin-top:8px;font-size:11px;color:#a0a7ae}footer{margin-top:auto;padding-top:68px;color:#aab0b7;font-size:11px;text-align:center;line-height:1.9}.footer-meta{margin-top:4px;color:#b4b9bf}.footer-meta a{color:inherit;text-decoration:none}.sep{margin:0 8px;color:#c2c6cb}@media(max-width:620px){.page{padding-top:56px}.panel{margin-top:32px;padding:13px}.actions{flex-direction:column}.ghost{width:100%}.media{grid-template-columns:1fr;padding:16px}.cover{width:100%;height:auto;aspect-ratio:16/11}.downloadbar{grid-template-columns:1fr}.downloadbar .btn,.downloadbar button{width:100%}.sub{font-size:15px}}
  </style>
</head>
<body>
<main class="page">
  <section class="hero"><div class="mark">视</div><h1>微信视频号下载</h1><p class="sub">粘贴视频号分享链接，解析后保存公开视频。</p></section>
  <section class="panel">
    <textarea id="input" placeholder="粘贴视频号分享链接或整段分享文字，例如：https://weixin.qq.com/sph/..." spellcheck="false"></textarea>
    <div class="actions"><button id="parseBtn" class="primary" disabled>开始解析</button><button id="pasteBtn" class="ghost">粘贴</button><button id="clearBtn" class="ghost">清空</button></div>
    <div id="status" class="status"></div>
  </section>
  <section id="result" class="result">
    <div class="media"><img id="cover" class="cover" alt="视频封面" referrerpolicy="no-referrer"><div class="meta"><div id="title" class="title">微信视频号视频</div><div id="author" class="author"></div><div class="chips"><span class="chip">公开视频</span><span id="codec" class="chip">MP4</span></div></div></div>
    <div class="downloadbar"><a id="downloadBtn" class="btn download" href="#" target="_blank" rel="noopener noreferrer">下载 / 打开原视频</a><button id="copyBtn" class="ghost">复制视频直链</button><button id="newBtn" class="ghost">解析另一个</button></div>
  </section>
  <div class="tip">如果浏览器直接播放视频，可在播放页面选择“保存视频”或“视频另存为”。<div class="privacy">解析由本站服务器完成；视频文件不在本站长期保存。</div></div>
  <footer><div>仅支持公开可访问的视频。解析能力可能随微信接口调整而变化。</div><div class="footer-meta"><a href="mailto:linhu@scu.edu.cn">linhu@scu.edu.cn</a><span class="sep">·</span><span id="busuanzi_container_page_pv" style="display:none">累计访问 <span id="busuanzi_value_page_pv"></span> 次</span></div></footer>
</main>
<script>
(() => {
  const input=document.getElementById('input'),parseBtn=document.getElementById('parseBtn'),pasteBtn=document.getElementById('pasteBtn'),clearBtn=document.getElementById('clearBtn'),status=document.getElementById('status'),result=document.getElementById('result'),cover=document.getElementById('cover'),title=document.getElementById('title'),author=document.getElementById('author'),codec=document.getElementById('codec'),downloadBtn=document.getElementById('downloadBtn'),copyBtn=document.getElementById('copyBtn'),newBtn=document.getElementById('newBtn');let current='';
  const extract=t=>((t||'').match(/https?:\/\/[^\s<>"'，。；、）)】]+/g)||[]).find(u=>{try{const h=new URL(u).hostname.toLowerCase();return h==='weixin.qq.com'||h==='channels.weixin.qq.com'||h.endsWith('.weixin.qq.com')}catch{return false}})||'';
  const setStatus=(kind,text)=>{status.className='status show '+kind;status.textContent=text};const hideStatus=()=>{status.className='status';status.textContent=''};const reset=()=>{result.classList.remove('show');cover.classList.remove('show');cover.removeAttribute('src');current=''};
  input.addEventListener('input',()=>parseBtn.disabled=!extract(input.value));clearBtn.onclick=()=>{input.value='';parseBtn.disabled=true;hideStatus();reset();input.focus()};newBtn.onclick=()=>{clearBtn.click();scrollTo({top:0,behavior:'smooth'})};pasteBtn.onclick=async()=>{try{input.value=await navigator.clipboard.readText();input.dispatchEvent(new Event('input'))}catch{input.focus()}};
  parseBtn.onclick=async()=>{const url=extract(input.value);if(!url)return;reset();parseBtn.disabled=true;setStatus('loading','正在解析视频，请稍候…');try{const r=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'解析失败');const v=j.video;current=v.videoUrl;title.textContent=v.title||'微信视频号视频';author.textContent=v.author?'视频号：'+v.author:'';author.style.display=v.author?'block':'none';codec.textContent=v.codec||'MP4';if(v.cover){cover.src=v.cover;cover.classList.add('show')}downloadBtn.href=v.videoUrl;hideStatus();result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'nearest'})}catch(e){setStatus('error',e.message||'解析失败，请稍后再试。')}finally{parseBtn.disabled=!extract(input.value)}};
  copyBtn.onclick=async()=>{if(!current)return;try{await navigator.clipboard.writeText(current);copyBtn.textContent='已复制';setTimeout(()=>copyBtn.textContent='复制视频直链',1200)}catch{prompt('复制视频直链：',current)}};
})();
</script>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
