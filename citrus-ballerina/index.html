<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Citrus Ballerina</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efeee9;}
  body{display:grid;place-items:center;}
  #stage{position:relative;width:min(100vw,74.8276vh);aspect-ratio:1085/1450;overflow:hidden;}
  #base,#ink{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #base{object-fit:cover;user-select:none;-webkit-user-drag:none;}
  #ink{pointer-events:none;}
  *{cursor:none!important;}
</style>
</head>
<body>
<div id="stage" aria-label="Animated hand-drawn citrus ballerina artwork">
  <img id="base" alt="Slice of lime" src="https://www.bubbbly.com/assets/slice-of-lime.webp" />
  <canvas id="ink" width="1085" height="1450"></canvas>
</div>
<script>
(() => {
  const W=1085,H=1450;
  const canvas=document.getElementById('ink');
  const ctx=canvas.getContext('2d');
  const INK='#244936', GREEN='#3f7d55', SOFT='rgba(63,125,85,.34)', BLUSH='rgba(174,91,65,.58)', LIGHT='rgba(80,132,86,.23)';
  ctx.lineCap='round'; ctx.lineJoin='round';

  const j=(pts,a=1.35)=>pts.map((p,i)=>[p[0]+Math.sin(i*1.91+.7)*a,p[1]+Math.cos(i*1.37+.3)*a]);
  const line=(pts,color=INK,width=5,a=1.25)=>({type:'line',pts:j(pts,a),color,width});
  const dot=(x,y,r,color)=>({type:'dot',x,y,r,color});
  function cubic(p0,p1,p2,p3,n=48){const out=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return out;}
  function quad(p0,p1,p2,n=34){const out=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}return out;}
  function ellipse(cx,cy,rx,ry,s=0,e=Math.PI*2,n=64){const out=[];for(let i=0;i<=n;i++){const t=s+(e-s)*i/n;out.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)]);}return out;}
  function poly(...pts){return pts;}

  const s=[];
  s.push(line(ellipse(557,174,23,18,0,Math.PI*2),GREEN,4.2,1.0));
  s.push(line(cubic([542,184],[531,191],[526,206],[529,218]),INK,3.4,1.0));
  s.push(line(cubic([572,184],[583,191],[588,205],[586,218]),INK,3.4,1.0));
  s.push(line(ellipse(557,231,35,42,0,Math.PI*2),INK,5.0,1.2));
  s.push(line(cubic([529,220],[540,199],[568,196],[586,221]),GREEN,3.2,1.0));
  s.push(line(quad([539,230],[546,226],[553,231],12),INK,2.6,.7));
  s.push(line(quad([562,231],[569,226],[576,230],12),INK,2.6,.7));
  s.push(line(quad([556,236],[553,247],[558,248],10),INK,2.2,.6));
  s.push(line(quad([545,259],[557,266],[570,258],18),BLUSH,2.8,.6));
  s.push(dot(534,250,4.6,'rgba(174,91,65,.30)'));
  s.push(dot(580,250,4.6,'rgba(174,91,65,.30)'));
  s.push(line(cubic([543,269],[543,290],[540,307],[529,319]),INK,4.5,1.0));
  s.push(line(cubic([571,269],[571,290],[575,306],[586,318]),INK,4.5,1.0));
  s.push(line(quad([529,319],[557,337],[586,318],30),INK,4.1,.9));
  s.push(line(cubic([529,319],[501,325],[481,342],[468,365]),INK,5.0,1.2));
  s.push(line(cubic([586,318],[613,325],[634,343],[647,365]),INK,5.0,1.2));
  s.push(line(cubic([468,365],[470,410],[486,466],[505,536]),INK,5.6,1.4));
  s.push(line(cubic([647,365],[644,411],[628,470],[609,536]),INK,5.6,1.4));
  s.push(line(quad([505,536],[557,550],[609,536],34),INK,5.0,1.0));
  s.push(line(cubic([487,380],[510,365],[534,359],[557,366]),GREEN,3.4,1.0));
  s.push(line(cubic([557,366],[581,359],[606,366],[629,381]),GREEN,3.4,1.0));
  s.push(line(quad([502,418],[557,448],[613,418],34),GREEN,3.2,1.0));
  s.push(line(quad([502,457],[557,481],[612,456],34),SOFT,3.0,.8));
  s.push(line(quad([509,497],[557,515],[605,497],30),SOFT,2.8,.8));
  s.push(line(poly([525,387],[525,518]),SOFT,2.7,.7));
  s.push(line(poly([589,387],[589,518]),SOFT,2.7,.7));
  s.push(line(cubic([470,357],[427,345],[385,318],[346,283]),INK,5.3,1.4));
  s.push(line(cubic([346,283],[307,249],[288,209],[303,171]),INK,5.3,1.4));
  s.push(line(cubic([487,378],[443,366],[403,342],[364,305]),GREEN,3.4,1.1));
  s.push(line(cubic([364,305],[327,270],[309,228],[319,187]),GREEN,3.4,1.1));
  s.push(line(cubic([303,171],[307,156],[318,144],[332,140]),INK,3.0,.8));
  s.push(line(cubic([319,187],[322,169],[332,154],[345,148]),INK,3.0,.8));
  s.push(line(cubic([332,140],[337,128],[343,121],[350,116]),INK,2.4,.6));
  s.push(line(cubic([332,140],[324,129],[321,120],[322,111]),INK,2.4,.6));
  s.push(line(cubic([332,140],[343,137],[352,139],[360,145]),INK,2.4,.6));
  s.push(line(cubic([644,356],[690,339],[736,306],[778,262]),INK,5.3,1.4));
  s.push(line(cubic([778,262],[816,222],[831,181],[815,145]),INK,5.3,1.4));
  s.push(line(cubic([628,378],[678,359],[719,331],[760,287]),GREEN,3.4,1.1));
  s.push(line(cubic([760,287],[798,247],[814,204],[803,162]),GREEN,3.4,1.1));
  s.push(line(cubic([815,145],[811,132],[801,121],[789,116]),INK,3.0,.8));
  s.push(line(cubic([803,162],[800,146],[789,131],[776,125]),INK,3.0,.8));
  s.push(line(cubic([789,116],[784,103],[778,95],[771,91]),INK,2.4,.6));
  s.push(line(cubic([789,116],[798,105],[801,96],[800,87]),INK,2.4,.6));
  s.push(line(cubic([789,116],[778,114],[769,118],[762,124]),INK,2.4,.6));
  s.push(line(quad([506,540],[557,556],[608,540],38),GREEN,4.5,1.0));
  s.push(line(quad([516,551],[557,565],[598,551],30),SOFT,2.8,.8));
  s.push(line(quad([465,632],[439,646],[416,668],22),LIGHT,2.6,.8));
  s.push(line(quad([650,626],[679,639],[704,660],22),LIGHT,2.6,.8));
  s.push(line(quad([453,724],[424,726],[398,733],18),LIGHT,2.6,.8));
  s.push(line(quad([661,724],[690,726],[717,735],18),LIGHT,2.6,.8));
  s.push(line(cubic([493,944],[489,967],[489,986],[495,1004]),INK,4.6,1.0));
  s.push(line(cubic([619,944],[624,966],[623,985],[616,1004]),INK,4.6,1.0));
  s.push(line(quad([495,1004],[557,1021],[616,1004],30),SOFT,3.0,.8));
  s.push(line(cubic([495,1000],[491,1081],[481,1169],[458,1254]),INK,6.0,1.5));
  s.push(line(cubic([458,1254],[448,1293],[443,1329],[441,1364]),INK,5.7,1.4));
  s.push(line(cubic([530,1002],[529,1080],[518,1169],[491,1258]),GREEN,4.1,1.2));
  s.push(line(cubic([491,1258],[481,1296],[472,1331],[466,1362]),GREEN,4.1,1.2));
  s.push(line(quad([456,1253],[475,1264],[492,1257],16),SOFT,2.8,.7));
  s.push(line(cubic([441,1364],[438,1381],[434,1396],[443,1404]),INK,4.7,1.0));
  s.push(line(cubic([443,1404],[453,1412],[471,1395],[466,1362]),INK,4.7,1.0));
  s.push(line(quad([441,1380],[456,1391],[469,1376],18),BLUSH,3.1,.8));
  s.push(line(poly([450,1347],[469,1364]),BLUSH,2.8,.6));
  s.push(line(poly([468,1347],[449,1367]),BLUSH,2.8,.6));
  s.push(line(cubic([584,999],[645,1026],[712,1073],[785,1132]),INK,6.0,1.5));
  s.push(line(cubic([785,1132],[829,1168],[864,1189],[898,1196]),INK,5.7,1.4));
  s.push(line(cubic([616,1003],[675,1034],[738,1082],[807,1138]),GREEN,4.1,1.2));
  s.push(line(cubic([807,1138],[845,1167],[876,1180],[908,1179]),GREEN,4.1,1.2));
  s.push(line(quad([785,1133],[797,1151],[808,1139],16),SOFT,2.8,.7));
  s.push(line(cubic([898,1196],[914,1199],[930,1196],[940,1186]),INK,4.7,1.0));
  s.push(line(cubic([908,1179],[921,1171],[934,1174],[940,1186]),INK,4.7,1.0));
  s.push(line(quad([909,1180],[924,1188],[937,1182],18),BLUSH,3.1,.8));
  s.push(line(poly([871,1167],[900,1182]),BLUSH,2.8,.6));
  s.push(line(poly([886,1154],[907,1181]),BLUSH,2.8,.6));
  s.push(line(cubic([540,285],[548,292],[565,293],[574,284]),SOFT,2.5,.7));
  s.push(line(quad([513,540],[557,548],[601,540],24),INK,2.8,.7));
  s.push(line(quad([444,1404],[455,1407],[466,1402],12),INK,2.4,.5));
  s.push(line(quad([911,1196],[925,1195],[939,1186],12),INK,2.4,.5));

  const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
  const len=st=>st.type==='dot'?36:st.pts.slice(1).reduce((L,p,i)=>L+dist(st.pts[i],p),0);
  const durations=s.map(st=>Math.max(70,len(st)*1.55));
  const leadIn=1050, total=durations.reduce((a,b)=>a+b,0), finalHold=5200, cycle=leadIn+total+finalHold;

  function part(st,p){
    if(st.type==='dot'){
      ctx.fillStyle=st.color;ctx.beginPath();ctx.arc(st.x,st.y,st.r*Math.min(1,p*1.6),0,Math.PI*2);ctx.fill();return [st.x,st.y];
    }
    const pts=st.pts;if(p<=0)return null;
    ctx.strokeStyle=st.color;ctx.lineWidth=st.width;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    const target=(pts.length-1)*Math.min(1,p),whole=Math.floor(target),frac=target-whole;
    for(let i=1;i<=whole&&i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    let cur=pts[Math.min(whole,pts.length-1)];
    if(whole<pts.length-1){const a=pts[whole],b=pts[whole+1],x=a[0]+(b[0]-a[0])*frac,y=a[1]+(b[1]-a[1])*frac;ctx.lineTo(x,y);cur=[x,y];}
    ctx.stroke();return cur;
  }
  const full=st=>part(st,1);

  function pencil(x,y){
    ctx.save();ctx.translate(x,y);ctx.rotate(-.62);
    ctx.shadowColor='rgba(0,0,0,.17)';ctx.shadowBlur=5;ctx.shadowOffsetY=2;
    ctx.fillStyle='#f0cf62';ctx.beginPath();ctx.roundRect(-2,-27,7,22,2);ctx.fill();
    ctx.fillStyle='#d87873';ctx.fillRect(-2,-30,7,5);
    ctx.fillStyle='#244936';ctx.beginPath();ctx.moveTo(-2,-5);ctx.lineTo(5,-5);ctx.lineTo(1.5,2);ctx.closePath();ctx.fill();ctx.restore();
  }

  function render(ms){
    ctx.clearRect(0,0,W,H);
    const staticFinal=new URLSearchParams(location.search).get('final')==='1';
    let t=staticFinal?leadIn+total+1:(ms%cycle);
    if(t<leadIn){if(!staticFinal)requestAnimationFrame(render);return;}
    t-=leadIn;
    let acc=0,cursor=null,drawing=false;
    for(let i=0;i<s.length;i++){
      const st=s[i],d=durations[i];
      if(t>=acc+d){full(st);acc+=d;continue;}
      if(t>=acc){cursor=part(st,(t-acc)/d);drawing=true;}
      break;
    }
    ctx.save();ctx.globalAlpha=.12;ctx.lineWidth=1.15;
    let passed=0;
    for(let i=0;i<s.length;i++){
      const st=s[i];passed+=durations[i];if(t<passed)break;
      if(st.type==='line'&&st.width>=4.5){ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(st.pts[0][0]+1.5,st.pts[0][1]-1);for(let k=1;k<st.pts.length;k++)ctx.lineTo(st.pts[k][0]+Math.sin(k*.8)*1.5,st.pts[k][1]-1);ctx.stroke();}
    }
    ctx.restore();
    if(drawing&&cursor)pencil(cursor[0]+4,cursor[1]-2);
    if(!staticFinal)requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
